# --- Gradle daemon / JVM ---
# The project is expected to build on a phone-sized cloud runner (GitHub Actions
# ubuntu-latest) and on small self-hosted runners, so heap is deliberately modest
# and the Kotlin compiler runs in-process to avoid a second multi-hundred-MB JVM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=36

# --- Kotlin ---
kotlin.code.style=official
